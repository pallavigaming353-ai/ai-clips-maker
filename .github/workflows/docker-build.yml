name: Docker build validation
on:
  push:
    paths:
      - 'Dockerfile.frontend'
      - '.dockerignore'
      - 'compose.yaml'
      - 'app/**'
      - 'middleware.ts'
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'Dockerfile.frontend'
      - '.dockerignore'
      - 'compose.yaml'
      - 'app/**'
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        env:
          CLIPPER_API_TOKEN: ci-test-token-not-for-production
          CLIPPER_SITE_USER: ci-owner
          CLIPPER_SITE_PASSWORD: ci-password-not-for-production
        run: docker compose config --quiet
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t ai-clips-maker-web:ci .
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t ai-clips-maker-api:ci backend
      - name: Smoke-test backend health
        run: |
          docker network create clipper-ci
          docker run -d --name clipper-api-test --network clipper-ci -p 127.0.0.1:18000:8000 \
            -e DEPLOYMENT_ENV=production \
            -e CLIPPER_API_TOKEN=ci-test-token-not-for-production ai-clips-maker-api:ci
          for i in $(seq 1 30); do
            if curl --fail --silent -H "Authorization: Bearer ci-test-token-not-for-production" http://127.0.0.1:18000/api/ready; then exit 0; fi
            sleep 2
          done
          docker logs clipper-api-test
          exit 1

      - name: Smoke-test private website access
        run: |
          docker run -d --name clipper-web-test --network clipper-ci -p 127.0.0.1:13000:3000 \
            -e CLIPPER_SITE_USER=ci-owner \
            -e CLIPPER_SITE_PASSWORD=ci-password-not-for-production \
            -e CLIPPER_API_TOKEN=ci-test-token-not-for-production \
            -e CLIPPER_BACKEND_URL=http://clipper-api-test:8000 ai-clips-maker-web:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/ || true)
            if [ "$code" = "401" ]; then break; fi
            sleep 2
          done
          test "$code" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci-owner:wrong http://127.0.0.1:13000/)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci-owner:ci-password-not-for-production http://127.0.0.1:13000/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/api/jobs/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci-owner:ci-password-not-for-production http://127.0.0.1:13000/api/unknown)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci-owner:ci-password-not-for-production http://127.0.0.1:13000/api/jobs/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci-owner:ci-password-not-for-production http://127.0.0.1:13000/api/jobs/from-link)" = "404"
