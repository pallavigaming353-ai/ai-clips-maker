name: Frontend build
on:
  push:
    paths:
      - 'app/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/frontend-check.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/frontend-check.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
