services:
  api:
    build:
      context: ./backend
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CLIPPER_DATA_DIR: /srv/clipper-data
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      MAX_ACTIVE_JOBS: "1"
      DIRECT_VIDEO_HOSTS: ${DIRECT_VIDEO_HOSTS:-}
      DEPLOYMENT_ENV: production
      CLIPPER_API_TOKEN: ${CLIPPER_API_TOKEN:?Set CLIPPER_API_TOKEN in .env}
    volumes:
      - clipper_data:/srv/clipper-data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      CLIPPER_BACKEND_URL: http://api:8000
      CLIPPER_API_TOKEN: ${CLIPPER_API_TOKEN:?Set CLIPPER_API_TOKEN in .env}
      CLIPPER_SITE_USER: ${CLIPPER_SITE_USER:?Set CLIPPER_SITE_USER in .env}
      CLIPPER_SITE_PASSWORD: ${CLIPPER_SITE_PASSWORD:?Set CLIPPER_SITE_PASSWORD in .env}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  clipper_data:
